version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - supabase-db

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: docmd-onlyoffice
    ports:
      - "8080:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=docmd-onlyoffice-jwt-secret
      - JWT_HEADER=Authorization
      - JWT_IN_BODY=true
    volumes:
      - ./docker/onlyoffice-nginx-headers.conf:/etc/nginx/conf.d/large-headers.conf:ro
      - ./fonts:/usr/share/fonts/custom:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  supabase-db:
    image: supabase/postgres:15.6.1.143
    ports:
      - "54322:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: docmd
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d

volumes:
  supabase-db-data:
